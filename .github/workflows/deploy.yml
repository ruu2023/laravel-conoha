name: Deploy to ConoHa WING

on:
  push:
    branches:
      - main # main ブランチに push されたら自動起動

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: SSH で ConoHa WING に接続してデプロイコマンドを実行
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ~/laravel-conoha

            # 1. 最新コードの取得
            git pull origin main

            # 2. 依存関係のインストール（Composerグローバル化済みの場合は composer でOK）
            /opt/alt/php84/usr/bin/php composer.phar install --no-dev --optimize-autoloader

            # 3. DB マイグレーション
            /opt/alt/php84/usr/bin/php artisan migrate --force

            # 4. キャッシュ再構築
            /opt/alt/php84/usr/bin/php artisan config:cache
            /opt/alt/php84/usr/bin/php artisan route:cache
            /opt/alt/php84/usr/bin/php artisan view:cache
