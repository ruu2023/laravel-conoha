name: Deploy to ConoHa WING

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: SSH で ConoHa WING に接続してデプロイコマンドを実行
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ~/laravel-conoha

            # 1. 最新コードの取得
            git pull origin main

            # 2. PHP 8.4 のフルパスでグローバル Composer を実行
            /opt/alt/php84/usr/bin/php ~/.local/bin/composer install --no-dev --optimize-autoloader

            # 3. DB マイグレーション
            /opt/alt/php84/usr/bin/php artisan migrate --force

            # 4. キャッシュ再構築
            #    ルーティングは X-App-Subdomain ヘッダー（リクエスト時にしか
            #    わからない）で分岐するため route:cache は使えない。古いキャッシュが
            #    残っていると route:cache 時点のサブドメインで固定されてしまうので明示的に破棄する。
            /opt/alt/php84/usr/bin/php artisan config:cache
            /opt/alt/php84/usr/bin/php artisan route:clear
            /opt/alt/php84/usr/bin/php artisan view:cache

            # 5. 公開ディレクトリのシンボリックリンクを同期
            #    public/ 直下に新しい静的ファイルが増えても自動でリンクを張る
            cd ~/public_html/laravel.ruu-dev.com
            shopt -s dotglob
            for f in ~/laravel-conoha/public/*; do
              name=$(basename "$f")
              if [ -f "$f" ]; then
                ln -sfn "$f" "$name"
              fi
            done
            shopt -u dotglob
            ln -sfn ~/laravel-conoha/public/build build
