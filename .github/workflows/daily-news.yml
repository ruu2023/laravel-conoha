name: Daily AI+Security News

on:
  workflow_dispatch:
  schedule:
    # 毎日 09:17 JST = 00:17 UTC
    - cron: "17 0 * * *"

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "scripts/package-lock.json"

      - name: Install dependencies
        working-directory: scripts
        run: npm ci

      - name: Run script
        env:
          REQUESTY_API_KEY: ${{ secrets.REQUESTY_API_KEY }}
        run: node scripts/generate-news.mjs

      - name: Debug files
        run: |
          test -f public/data/zundamon/data.json && cat public/data/zundamon/data.json || echo "data.json NOT found"

      # Gitにはコミットせず、生成物はConoHa WINGへ直接同期する
      # (リポジトリを肥大化させないため)。deploy.yml側で
      # ~/laravel-conoha/public/data を各docrootにシンボリックリンクしている。
      - name: Ensure remote directory exists
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: mkdir -p ~/laravel-conoha/public/data/zundamon

      - name: Sync data.json to ConoHa WING
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "public/data/zundamon/data.json"
          target: "~/laravel-conoha/public/data/zundamon"
          strip_components: 3
          overwrite: true
